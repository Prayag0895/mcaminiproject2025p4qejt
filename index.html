<!doctype html>
<html>
    <head>
        <title>Unified AR Experience</title>
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
        <!-- Import handlers -->
        <script src="js/handlers/video-init.js"></script>
        <script src="js/handlers/sound-handler.js"></script>
        <script src="js/handlers/buddhapark-handler.js"></script>
        <script src="js/handlers/samdruptse-handler.js"></script>
        <script src="js/handlers/rabdentse-handler.js"></script>
        <script src="js/handlers/pemayangtse-handler.js"></script>
        <style>
            .hidden {
                display: none;
            }
        </style>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <div id="loading" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; justify-content: center; align-items: center; z-index: 9999;">
            Loading videos... Please wait.
        </div>
        
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            renderer="logarithmicDepthBuffer: true;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
            gesture-detector
        >
            <a-assets>
                <!-- Red Panda Assets -->
                <a-asset-item id="redpanda-model" src="assets/redpanda/asset.glb"></a-asset-item>
                <audio 
                    id="panda-sound" 
                    preload="auto" 
                    crossorigin="anonymous"
                    loop
                    playsinline
                    autoplay
                >
                    <source src="assets/redpanda/redpanda.mp3" type="audio/mpeg">
                </audio>

                <!-- Buddha Park Assets -->
                <video
                    id="buddhapark-video"
                    src="assets/buddhapark/BP.mp4"
                    preload="auto"
                    loop
                    crossorigin="anonymous"
                    playsinline
                    webkit-playsinline
                    autoplay
                ></video>

                <!-- Samdruptse Assets -->
                <video
                    id="samdruptse-video"
                    src="assets/samdruptse/Sam.mp4"
                    preload="auto"
                    loop
                    crossorigin="anonymous"
                    playsinline
                    webkit-playsinline
                    autoplay
                ></video>

                <!-- Rabdentse Assets -->
                <video
                    id="rabdentse-video"
                    src="assets/rabdentse/RB.mp4"
                    preload="auto"
                    loop
                    crossorigin="anonymous"
                    playsinline
                    webkit-playsinline
                    autoplay
                ></video>

                <!-- Pemayangtse Assets -->
                <video
                    id="pemayangtse-video"
                    src="assets/pemayangtse/PM.mp4"
                    preload="auto"
                    loop
                    crossorigin="anonymous"
                    playsinline
                    webkit-playsinline
                    autoplay
                ></video>
            </a-assets>

            <!-- Red Panda Marker -->
            <a-marker
                id="redpanda-marker"
                type="pattern"
                preset="custom"
                url="assets/redpanda/pattern-RP.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
                sound-handler
            >
                <a-entity
                    scale="1 1 1"
                    animation-mixer="loop: repeat"
                    gltf-model="#redpanda-model"
                    class="clickable"
                    gesture-handler
                ></a-entity>
            </a-marker>

            <!-- Buddha Park Marker -->
            <a-marker
                id="buddhapark-marker"
                type="pattern"
                preset="custom"
                url="assets/buddhapark/pattern-BP.patt"
                buddhapark-handler
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <a-video
                    src="#buddhapark-video"
                    scale="1 1 1"
                    position="0 0.1 0"
                    rotation="-90 0 0"
                    class="clickable"
                    gesture-handler
                    play="true"
                ></a-video>
            </a-marker>

            <!-- Samdruptse Marker -->
            <a-marker
                id="samdruptse-marker"
                type="pattern"
                preset="custom"
                url="assets/samdruptse/pattern-SM.patt"
                samdruptse-handler
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <a-video
                    src="#samdruptse-video"
                    scale="1 1 1"
                    position="0 0.1 0"
                    rotation="-90 0 0"
                    class="clickable"
                    gesture-handler
                    play="true"
                ></a-video>
            </a-marker>

            <!-- Rabdentse Marker -->
            <a-marker
                id="rabdentse-marker"
                type="pattern"
                preset="custom"
                url="assets/rabdentse/pattern-RB.patt"
                rabdentse-handler
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <a-video
                    src="#rabdentse-video"
                    scale="1 1 1"
                    position="0 0.1 0"
                    rotation="-90 0 0"
                    class="clickable"
                    gesture-handler
                    play="true"
                ></a-video>
            </a-marker>

            <!-- Pemayangtse Marker -->
            <a-marker
                id="pemayangtse-marker"
                type="pattern"
                preset="custom"
                url="assets/pemayangtse/PM.patt"
                pemayangtse-handler
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <a-video
                    src="#pemayangtse-video"
                    scale="1 1 1"
                    position="0 0.1 0"
                    rotation="-90 0 0"
                    class="clickable"
                    gesture-handler
                    play="true"
                ></a-video>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>

        <script>
            // Hide loading screen when all videos are loaded
            window.addEventListener('load', function() {
                const videos = document.getElementsByTagName('video');
                let loadedVideos = 0;
                
                function checkAllVideosLoaded() {
                    loadedVideos++;
                    if (loadedVideos === videos.length) {
                        document.getElementById('loading').style.display = 'none';
                    }
                }

                for (let i = 0; i < videos.length; i++) {
                    videos[i].addEventListener('loadeddata', checkAllVideosLoaded);
                }
            });
        </script>
    </body>
</html>
