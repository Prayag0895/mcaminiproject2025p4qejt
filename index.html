<!doctype html>
<html>
    <head>
        <title>Unified AR Experience</title>
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
        <style>
            .hidden {
                display: none;
            }
        </style>
        <script>
            window.onload = function() {
                const videos = document.getElementsByTagName('video');
                for (let i = 0; i < videos.length; i++) {
                    videos[i].playsInline = true;
                    videos[i].crossOrigin = 'anonymous';
                    videos[i].muted = false;
                    videos[i].volume = 1.0;
                    videos[i].load();
                }
            };

            // Video handler for video content
            AFRAME.registerComponent('video-handler', {
                init: function () {
                    var marker = this.el;
                    this.vid = document.querySelector('#' + this.el.getAttribute('video-target'));
                    
                    marker.addEventListener('markerFound', function () {
                        this.vid.muted = false;
                        this.vid.volume = 1.0;
                        var playPromise = this.vid.play();
                        if (playPromise !== undefined) {
                            playPromise.then(_ => {
                                console.log('Video playing with sound');
                            })
                            .catch(error => {
                                console.log('Video play error:', error);
                                // If autoplay with sound fails, try with mute first then unmute
                                this.vid.muted = true;
                                this.vid.play().then(() => {
                                    this.vid.muted = false;
                                });
                            });
                        }
                    }.bind(this));

                    marker.addEventListener('markerLost', function () {
                        this.vid.pause();
                    }.bind(this));
                }
            });
        </script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <div id="loading" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; justify-content: center; align-items: center; z-index: 9999;">
            Loading videos... Please wait.
        </div>
        
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            renderer="logarithmicDepthBuffer: true;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
            gesture-detector
        >
            <a-assets>
                <!-- Red Panda Assets -->
                <a-asset-item id="redpanda-model" src="assets/redpanda/asset.glb"></a-asset-item>

                <!-- Buddha Park Assets -->
                <video
                    id="buddhapark-video"
                    src="assets/buddhapark/BP.mp4"
                    preload="auto"
                    response-type="arraybuffer"
                    loop
                    crossorigin="anonymous"
                    webkit-playsinline
                    playsinline
                ></video>

                <!-- Samdruptse Assets -->
                <video
                    id="samdruptse-video"
                    src="assets/samdruptse/Sam.mp4"
                    preload="auto"
                    response-type="arraybuffer"
                    loop
                    crossorigin="anonymous"
                    webkit-playsinline
                    playsinline
                ></video>

                <!-- Rabdentse Assets -->
                <video
                    id="rabdentse-video"
                    src="assets/rabdentse/RB.mp4"
                    preload="auto"
                    response-type="arraybuffer"
                    loop
                    crossorigin="anonymous"
                    webkit-playsinline
                    playsinline
                ></video>

                <!-- Pemayangtse Assets -->
                <video
                    id="pemayangtse-video"
                    src="assets/pemayangtse/PM.mp4"
                    preload="auto"
                    response-type="arraybuffer"
                    loop
                    crossorigin="anonymous"
                    webkit-playsinline
                    playsinline
                ></video>
            </a-assets>

            <!-- Red Panda Marker -->
            <a-marker
                id="redpanda-marker"
                type="pattern"
                preset="custom"
                url="assets/redpanda/pattern-RP.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <a-entity
                    scale="1 1 1"
                    animation-mixer="loop: repeat"
                    gltf-model="#redpanda-model"
                    class="clickable"
                    gesture-handler
                ></a-entity>
            </a-marker>

            <!-- Buddha Park Marker -->
            <a-marker
                id="buddhapark-marker"
                type="pattern"
                preset="custom"
                url="assets/buddhapark/pattern-BP.patt"
                video-handler="video-target: buddhapark-video"
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <a-video
                    src="#buddhapark-video"
                    scale="1 1 1"
                    position="0 0.1 0"
                    rotation="-90 0 0"
                    class="clickable"
                    gesture-handler
                ></a-video>
            </a-marker>

            <!-- Samdruptse Marker -->
            <a-marker
                id="samdruptse-marker"
                type="pattern"
                preset="custom"
                url="assets/samdruptse/pattern-SM.patt"
                video-handler="video-target: samdruptse-video"
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <a-video
                    src="#samdruptse-video"
                    scale="1 1 1"
                    position="0 0.1 0"
                    rotation="-90 0 0"
                    class="clickable"
                    gesture-handler
                ></a-video>
            </a-marker>

            <!-- Rabdentse Marker -->
            <a-marker
                id="rabdentse-marker"
                type="pattern"
                preset="custom"
                url="assets/rabdentse/pattern-RB.patt"
                video-handler="video-target: rabdentse-video"
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <a-video
                    src="#rabdentse-video"
                    scale="1 1 1"
                    position="0 0.1 0"
                    rotation="-90 0 0"
                    class="clickable"
                    gesture-handler
                ></a-video>
            </a-marker>

            <!-- Pemayangtse Marker -->
            <a-marker
                id="pemayangtse-marker"
                type="pattern"
                preset="custom"
                url="assets/pemayangtse/PM.patt"
                video-handler="video-target: pemayangtse-video"
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <a-video
                    src="#pemayangtse-video"
                    scale="1 1 1"
                    position="0 0.1 0"
                    rotation="-90 0 0"
                    class="clickable"
                    gesture-handler
                ></a-video>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>

        <script>
            // Hide loading screen when all videos are loaded
            window.addEventListener('load', function() {
                const videos = document.getElementsByTagName('video');
                let loadedVideos = 0;
                
                function checkAllVideosLoaded() {
                    loadedVideos++;
                    if (loadedVideos === videos.length) {
                        document.getElementById('loading').style.display = 'none';
                    }
                }

                for (let i = 0; i < videos.length; i++) {
                    videos[i].addEventListener('loadeddata', checkAllVideosLoaded);
                }
            });
        </script>
    </body>
</html>
