<!doctype html>
<html>
    <head>
        <title>Unified AR Experience</title>
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
        <!-- Import handlers -->
        <script src="js/handlers/video-init.js"></script>
        <script src="js/handlers/sound-handler.js"></script>
        <script src="js/handlers/buddhapark-handler.js"></script>
        <script src="js/handlers/samdruptse-handler.js"></script>
        <script src="js/handlers/rabdentse-handler.js"></script>
        <script src="js/handlers/pemayangtse-handler.js"></script>
        <style>
            .arjs-loader {
                height: 100%;
                width: 100%;
                position: absolute;
                top: 0;
                left: 0;
                background-color: rgba(0, 0, 0, 0.8);
                z-index: 9999;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .arjs-loader div {
                text-align: center;
                font-size: 1.25em;
                color: white;
            }
        </style>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <div class="arjs-loader">
            <div>Loading, please wait...</div>
        </div>
        
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            renderer="logarithmicDepthBuffer: true;"
            arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
            id="scene"
            embedded
            gesture-detector
        >
            <a-assets>
                <!-- Red Panda Assets -->
                <a-asset-item id="redpanda-model" src="assets/redpanda/asset.glb"></a-asset-item>
                <audio id="panda-sound" src="assets/redpanda/redpanda.mp3" preload="auto" loop></audio>

                <!-- Buddha Park Assets -->
                <video
                    id="buddhapark-video"
                    src="assets/buddhapark/BP.mp4"
                    preload="auto"
                    loop
                    crossorigin="anonymous"
                    playsinline
                    webkit-playsinline
                    autoplay
                ></video>

                <!-- Samdruptse Assets -->
                <video
                    id="samdruptse-video"
                    src="assets/samdruptse/Sam.mp4"
                    preload="auto"
                    loop
                    crossorigin="anonymous"
                    playsinline
                    webkit-playsinline
                    autoplay
                ></video>

                <!-- Rabdentse Assets -->
                <video
                    id="rabdentse-video"
                    src="assets/rabdentse/RB.mp4"
                    preload="auto"
                    loop
                    crossorigin="anonymous"
                    playsinline
                    webkit-playsinline
                    autoplay
                ></video>

                <!-- Pemayangtse Assets -->
                <video
                    id="pemayangtse-video"
                    src="assets/pemayangtse/PM.mp4"
                    preload="auto"
                    loop
                    crossorigin="anonymous"
                    playsinline
                    webkit-playsinline
                    autoplay
                ></video>
            </a-assets>

            <!-- Red Panda Marker -->
            <a-marker
                id="redpanda-marker"
                type="pattern"
                preset="custom"
                url="assets/redpanda/pattern-RP.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
                sound-handler
            >
                <a-entity
                    scale="1 1 1"
                    rotation="0 0 0"
                    animation-mixer="loop: repeat"
                    gltf-model="#redpanda-model"
                    class="clickable"
                    gesture-handler
                ></a-entity>
            </a-marker>

            <!-- Buddha Park Marker -->
            <a-marker
                id="buddhapark-marker"
                type="pattern"
                preset="custom"
                url="assets/buddhapark/pattern-BP.patt"
                buddhapark-handler
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <a-video
                    src="#buddhapark-video"
                    scale="1 1 1"
                    position="0 0.1 0"
                    rotation="-90 0 0"
                    class="clickable"
                    gesture-handler
                    play="true"
                ></a-video>
            </a-marker>

            <!-- Samdruptse Marker -->
            <a-marker
                id="samdruptse-marker"
                type="pattern"
                preset="custom"
                url="assets/samdruptse/pattern-SM.patt"
                samdruptse-handler
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <a-video
                    src="#samdruptse-video"
                    scale="1 1 1"
                    position="0 0.1 0"
                    rotation="-90 0 0"
                    class="clickable"
                    gesture-handler
                    play="true"
                ></a-video>
            </a-marker>

            <!-- Rabdentse Marker -->
            <a-marker
                id="rabdentse-marker"
                type="pattern"
                preset="custom"
                url="assets/rabdentse/pattern-RB.patt"
                rabdentse-handler
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <a-video
                    src="#rabdentse-video"
                    scale="1 1 1"
                    position="0 0.1 0"
                    rotation="-90 0 0"
                    class="clickable"
                    gesture-handler
                    play="true"
                ></a-video>
            </a-marker>

            <!-- Pemayangtse Marker -->
            <a-marker
                id="pemayangtse-marker"
                type="pattern"
                preset="custom"
                url="assets/pemayangtse/PM.patt"
                pemayangtse-handler
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <a-video
                    src="#pemayangtse-video"
                    scale="1 1 1"
                    position="0 0.1 0"
                    rotation="-90 0 0"
                    class="clickable"
                    gesture-handler
                    play="true"
                ></a-video>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>

        <script>
            window.addEventListener('load', function () {
                const scene = document.querySelector('a-scene');
                const loader = document.querySelector('.arjs-loader');
                
                // Remove loader when scene is loaded
                scene.addEventListener('loaded', function () {
                    loader.style.display = 'none';
                });

                // Remove loader when camera is ready
                scene.addEventListener('camera-init', function() {
                    loader.style.display = 'none';
                });

                // Fallback: Remove loader after 5 seconds if other events don't fire
                setTimeout(function() {
                    loader.style.display = 'none';
                }, 5000);
            });
        </script>
    </body>
</html>
